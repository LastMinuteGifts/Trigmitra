<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f05b45" />
    <style>
      #boot-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8f4ee;transition:opacity .55s ease}
      #boot-screen.done{opacity:0;pointer-events:none}
      .boot-mark{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#f05b45,#e8845a);color:#fff;font-size:34px;display:grid;place-items:center;animation:boot-pulse 1.2s ease-in-out infinite}
      .boot-name{font-weight:800;letter-spacing:.28em;font-size:15px;color:#1a2433;font-family:system-ui,sans-serif}
      .boot-sub{font-size:11px;color:#8a94a0;letter-spacing:.12em;font-family:system-ui,sans-serif}
      .boot-bar{width:170px;height:4px;border-radius:99px;background:rgba(26,36,51,.1);overflow:hidden}
      .boot-bar i{display:block;height:100%;width:40%;border-radius:99px;background:#f05b45;animation:boot-slide 1.1s ease-in-out infinite}
      .boot-sym{position:absolute;color:rgba(26,36,51,.16);font-family:Georgia,serif;font-size:26px;animation:boot-float 2.4s ease-in-out infinite}
      @keyframes boot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @keyframes boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    </style>
    <meta name="description" content="ANKNAWAB is a student-friendly maths and physics learning platform for Class 1 to 10 learners, offering step-by-step explanations and image-based question solving." />
    <title>ANKNAWAB | Sawalon Ka Nawab</title>
  </head>
  <body>
    <div id="boot-screen" aria-hidden="true">
      <span class="boot-sym" style="left:16%;top:28%">θ</span>
      <span class="boot-sym" style="right:18%;top:24%;animation-delay:.4s">π</span>
      <span class="boot-sym" style="left:22%;bottom:26%;animation-delay:.8s">√</span>
      <span class="boot-sym" style="right:22%;bottom:30%;animation-delay:1.2s">×</span>
      <span class="boot-sym" style="left:50%;top:14%;animation-delay:1.6s">÷</span>
      <div class="boot-mark">∿</div>
      <div class="boot-name">ANKNAWAB</div>
      <div class="boot-sub">sawalon ka nawab</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
